<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Menu Editor — Bootstrap 5 example</title>

  <!-- Framework CSS is loaded by the consumer (optional), NOT bundled by the library -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.2/css/all.min.css" rel="stylesheet">

  <!-- Menu Editor: structural styles from the built dist bundle -->
  <link rel="stylesheet" href="../../dist/styles.min.css">

  <style>
    body { background: #f6f8fa; }
    .app-header {
      background: linear-gradient(135deg, #4f46e5, #06b6d4);
      color: #fff;
    }
    .card { border: none; box-shadow: 0 2px 12px rgba(0,0,0,.06); }
  </style>
</head>
<body>
  <header class="app-header py-4 mb-4 shadow-sm">
    <div class="container">
      <h1 class="h3 fw-bold mb-1"><i class="fa-solid fa-bars-staggered me-2"></i>JavaScript Menu Editor</h1>
      <p class="mb-0 opacity-75">Drag &amp; drop nested menu — Bootstrap 5 theme</p>
    </div>
  </header>

  <main class="container pb-5">
    <div class="row g-4">
      <div class="col-lg-5">
        <div class="card">
          <div class="card-header bg-white fw-semibold">
            <i class="fa-solid fa-sitemap me-1 text-primary"></i> Menu structure
          </div>
          <div class="card-body">
            <div id="element-id"></div>
          </div>
        </div>
      </div>

      <div class="col-lg-4">
        <div class="card">
          <div class="card-header bg-primary text-white fw-semibold">
            <i class="fa-solid fa-pen-to-square me-1"></i> Item details
          </div>
          <div class="card-body">
            <div class="mb-3">
              <label for="txtText" class="form-label">Text</label>
              <input type="text" class="form-control" id="txtText" placeholder="Menu label" />
            </div>
            <div class="mb-3">
              <label for="txtIcon" class="form-label">Icon <span class="text-muted small">(Font Awesome class)</span></label>
              <input type="text" class="form-control" id="txtIcon" placeholder="fa-solid fa-house" />
            </div>
            <div class="mb-3">
              <label for="txtHref" class="form-label">URL / Path</label>
              <input type="text" class="form-control" id="txtHref" placeholder="/path" />
            </div>
            <div class="mb-3">
              <label for="txtTooltip" class="form-label">Tooltip</label>
              <input type="text" class="form-control" id="txtTooltip" placeholder="Tooltip text" />
            </div>
          </div>
          <div class="card-footer bg-white d-flex gap-2">
            <button id="btnUpdate" class="btn btn-outline-secondary" disabled>
              <i class="fa-solid fa-rotate"></i> Update
            </button>
            <button id="btnAdd" class="btn btn-primary ms-auto">
              <i class="fa-solid fa-plus"></i> Add item
            </button>
          </div>
        </div>
      </div>

      <div class="col-lg-3">
        <div class="card h-100">
          <div class="card-header bg-white fw-semibold d-flex align-items-center">
            <i class="fa-solid fa-code me-1 text-success"></i> JSON output
            <button id="btnOutput" class="btn btn-sm btn-success ms-auto">
              <i class="fa-solid fa-arrow-rotate-right"></i> Generate
            </button>
          </div>
          <div class="card-body p-2">
            <textarea id="txtOutput" class="form-control font-monospace small" rows="14" readonly
              placeholder="Click Generate to export the menu…"></textarea>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- Menu Editor: built dist bundle (SortableJS included). Global: MenuEditor -->
  <script src="../../dist/menu-editor.min.js"></script>
  <script src="./main.js"></script>
</body>
</html>
