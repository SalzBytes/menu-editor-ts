<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Menu Editor — Live demo</title>

  <!-- Roboto: canonical Material Design typeface -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.2/css/all.min.css" rel="stylesheet">

  <!-- Menu Editor structural styles (framework-agnostic) from the built dist bundle -->
  <link rel="stylesheet" href="../dist/styles.min.css">

  <!-- Tailwind Play CDN, configured with the Material You (MD3) token system -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ["Roboto", "system-ui", "sans-serif"] },
          colors: {
            md: {
              bg: "#FFFBFE",
              on: "#1C1B1F",
              primary: "#6750A4",
              "on-primary": "#FFFFFF",
              "secondary-container": "#E8DEF8",
              "on-secondary-container": "#1D192B",
              tertiary: "#7D5260",
              surface: "#F3EDF7",
              "surface-low": "#E7E0EC",
              outline: "#79747E",
              variant: "#49454F",
            },
          },
          borderRadius: { md4: "28px", md5: "48px" },
          transitionTimingFunction: { md: "cubic-bezier(0.2,0,0,1)" },
        },
      },
    };
  </script>

  <!-- The active menu-editor theme's framework CSS is loaded on demand here -->
  <link id="theme-css" rel="stylesheet" href="">

  <style>
    /* Material 3 filled text field: rounded top, 2px bottom border, tonal fill */
    .md-field {
      background: #E7E0EC;
      border: 0;
      border-bottom: 2px solid #79747E;
      border-radius: 12px 12px 0 0;
      transition: border-color .2s ease;
    }
    .md-field:focus { outline: none; border-bottom-color: #6750A4; }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body class="font-sans text-md-on bg-md-bg antialiased">
  <!-- Atmospheric organic blur shapes (decorative) -->
  <div aria-hidden="true" class="pointer-events-none fixed inset-0 overflow-hidden -z-10">
    <div class="absolute -top-32 -left-24 h-96 w-96 rounded-full bg-md-primary/30 blur-3xl mix-blend-multiply"></div>
    <div class="absolute top-1/3 -right-24 h-[28rem] w-[28rem] rounded-[100px] rounded-tr-[20px] bg-md-secondary-container/70 blur-3xl mix-blend-multiply"></div>
    <div class="absolute bottom-0 left-1/4 h-80 w-80 rounded-full bg-md-tertiary/20 blur-3xl mix-blend-multiply"></div>
  </div>

  <div class="mx-auto max-w-6xl px-5 py-10 md:py-16">
    <!-- Hero -->
    <header class="mb-10 overflow-hidden rounded-[32px] md:rounded-md5 bg-md-surface shadow-sm p-8 md:p-12 relative">
      <div aria-hidden="true" class="absolute -top-24 right-0 h-72 w-72 rounded-full bg-md-primary/10 blur-3xl"></div>
      <div class="relative flex flex-wrap items-end justify-between gap-6">
        <div>
          <span class="inline-flex items-center gap-2 rounded-full bg-md-secondary-container px-4 py-1.5 text-sm font-medium text-md-on-secondary-container">
            <i class="fa-solid fa-wand-magic-sparkles"></i> Menu Editor
          </span>
          <h1 class="mt-4 text-4xl md:text-5xl font-medium tracking-tight">JavaScript Menu Editor</h1>
          <p class="mt-3 max-w-xl text-lg text-md-variant">Drag &amp; drop nested menu with a live, theme-swappable presentation layer.</p>
        </div>

        <!-- Theme switcher: pill segmented control -->
        <div class="flex items-center gap-1 rounded-full bg-md-surface-low p-1.5 shadow-sm" role="group" aria-label="Presentation theme">
          <button data-theme="bootstrap" class="theme-btn rounded-full px-5 py-2 text-sm font-medium transition-all duration-200 ease-md active:scale-95 focus-visible:ring-2 focus-visible:ring-md-primary focus-visible:ring-offset-2">Bootstrap</button>
          <button data-theme="tailwind" class="theme-btn rounded-full px-5 py-2 text-sm font-medium transition-all duration-200 ease-md active:scale-95 focus-visible:ring-2 focus-visible:ring-md-primary focus-visible:ring-offset-2">Tailwind</button>
        </div>
      </div>
    </header>

    <div class="grid gap-6 lg:grid-cols-12">
      <!-- Menu tree -->
      <section class="lg:col-span-7 group rounded-[24px] bg-md-surface shadow-sm transition-all duration-300 ease-md hover:shadow-md">
        <div class="flex items-center gap-3 px-6 pt-6">
          <span class="grid h-10 w-10 place-items-center rounded-full bg-md-primary/10 text-md-primary"><i class="fa-solid fa-sitemap"></i></span>
          <h2 class="text-xl font-medium">Menu structure</h2>
          <span id="themeBadge" class="ml-auto rounded-full bg-md-secondary-container px-3 py-1 text-xs font-medium text-md-on-secondary-container">bootstrap</span>
        </div>
        <div class="p-6"><div id="element-id"></div></div>
      </section>

      <!-- Item form -->
      <section class="lg:col-span-5 rounded-[24px] bg-md-surface shadow-sm">
        <div class="flex items-center gap-3 px-6 pt-6">
          <span class="grid h-10 w-10 place-items-center rounded-full bg-md-primary/10 text-md-primary"><i class="fa-solid fa-pen-to-square"></i></span>
          <h2 class="text-xl font-medium">Item details</h2>
        </div>
        <div class="space-y-4 p-6">
          <div>
            <label for="txtText" class="mb-1.5 block text-sm font-medium text-md-variant">Text</label>
            <input id="txtText" class="md-field h-14 w-full px-4 text-md-on placeholder:text-md-on/50" placeholder="Menu label" />
          </div>
          <div>
            <label for="txtIcon" class="mb-1.5 block text-sm font-medium text-md-variant">Icon <span class="text-md-variant/70">(Font Awesome)</span></label>
            <input id="txtIcon" class="md-field h-14 w-full px-4 text-md-on placeholder:text-md-on/50" placeholder="fa-solid fa-house" />
          </div>
          <div>
            <label for="txtHref" class="mb-1.5 block text-sm font-medium text-md-variant">URL / Path</label>
            <input id="txtHref" class="md-field h-14 w-full px-4 text-md-on placeholder:text-md-on/50" placeholder="/path" />
          </div>
          <div>
            <label for="txtTooltip" class="mb-1.5 block text-sm font-medium text-md-variant">Tooltip</label>
            <input id="txtTooltip" class="md-field h-14 w-full px-4 text-md-on placeholder:text-md-on/50" placeholder="Tooltip text" />
          </div>
        </div>
        <div class="flex gap-3 px-6 pb-6">
          <button id="btnUpdate" disabled
            class="inline-flex h-11 items-center gap-2 rounded-full border border-md-outline px-6 text-sm font-medium text-md-primary transition-all duration-200 ease-md hover:bg-md-primary/5 active:scale-95 disabled:opacity-50 disabled:cursor-not-allowed focus-visible:ring-2 focus-visible:ring-md-primary focus-visible:ring-offset-2">
            <i class="fa-solid fa-rotate"></i> Update
          </button>
          <button id="btnAdd"
            class="ml-auto inline-flex h-11 items-center gap-2 rounded-full bg-md-primary px-6 text-sm font-medium text-md-on-primary shadow-sm transition-all duration-200 ease-md hover:bg-md-primary/90 hover:shadow-md active:scale-95 focus-visible:ring-2 focus-visible:ring-md-primary focus-visible:ring-offset-2">
            <i class="fa-solid fa-plus"></i> Add item
          </button>
        </div>
      </section>

      <!-- JSON output -->
      <section class="lg:col-span-12 flex flex-col rounded-[24px] bg-md-surface shadow-sm">
        <div class="flex items-center gap-3 px-6 pt-6">
          <span class="grid h-10 w-10 place-items-center rounded-full bg-md-tertiary/10 text-md-tertiary"><i class="fa-solid fa-code"></i></span>
          <h2 class="text-xl font-medium">JSON</h2>
          <button id="btnOutput"
            class="ml-auto inline-flex h-9 items-center gap-2 rounded-full bg-md-tertiary px-4 text-sm font-medium text-white shadow-sm transition-all duration-200 ease-md hover:bg-md-tertiary/90 hover:shadow-md active:scale-95 focus-visible:ring-2 focus-visible:ring-md-tertiary focus-visible:ring-offset-2">
            <i class="fa-solid fa-arrow-rotate-right"></i> Export
          </button>
        </div>
        <div class="flex-1 p-6">
          <textarea id="out" readonly aria-label="Menu JSON output"
            class="h-full min-h-[260px] w-full resize-y rounded-[16px] bg-md-surface-low p-4 font-mono text-xs leading-relaxed text-md-on shadow-inner placeholder:text-md-on/40 focus:outline-none focus-visible:ring-2 focus-visible:ring-md-primary"
            placeholder="Click Export to generate the menu JSON…"></textarea>
        </div>
      </section>
    </div>
  </div>

  <!-- Menu Editor: built dist bundle (SortableJS included). Global: MenuEditor -->
  <script src="../dist/menu-editor.min.js"></script>
  <script>
    // Working menu state. Kept in sync so a theme switch (which re-mounts the
    // editor) never loses items the user added/moved. Seeded with a demo tree.
    let nestedData = [
      { text: "Home", href: "/home", tooltip: "Go to home page", icon: "fa-solid fa-house", children: [] },
      { text: "About Us", href: "/about", tooltip: "About the company", icon: "fa-solid fa-address-card", children: [] },
      { text: "Services", href: "/services", tooltip: "What we offer", icon: "fa-solid fa-gear", children: [
        { text: "Service 1", href: "/services/1", tooltip: "Details 1", icon: "fa-solid fa-wrench", children: [] },
        { text: "Service 2", href: "/services/2", tooltip: "Details 2", icon: "fa-solid fa-wrench", children: [] },
      ]},
      { text: "Contact", href: "/contact", tooltip: "Get in touch", icon: "fa-solid fa-envelope", children: [] },
    ];

    const $ = (id) => document.getElementById(id);
    const fields = { text: $("txtText"), href: $("txtHref"), icon: $("txtIcon"), tooltip: $("txtTooltip") };
    const btnUpdate = $("btnUpdate"), btnAdd = $("btnAdd"), btnOutput = $("btnOutput");
    const out = $("out"), themeBadge = $("themeBadge");
    const readForm = () => ({ text: fields.text.value, href: fields.href.value, icon: fields.icon.value, tooltip: fields.tooltip.value });
    const cleanForm = () => Object.values(fields).forEach((f) => (f.value = ""));

    // Bootstrap CSS is loaded on demand; Tailwind is already on the page (Play CDN).
    const BOOTSTRAP_CSS = "https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css";
    const applyThemeCss = (theme) => { $("theme-css").href = theme === "bootstrap" ? BOOTSTRAP_CSS : ""; };

    // Segmented-control active styling (MD3 tonal state layer).
    const themeBtns = [...document.querySelectorAll(".theme-btn")];
    const paintButtons = (theme) => themeBtns.forEach((b) => {
      const active = b.dataset.theme === theme;
      b.classList.toggle("bg-md-primary", active);
      b.classList.toggle("text-md-on-primary", active);
      b.classList.toggle("shadow-sm", active);
      b.classList.toggle("text-md-variant", !active);
      b.setAttribute("aria-pressed", active);
    });

    // Snapshot the live DOM back into `nestedData` (survives a re-mount).
    const syncState = () => { nestedData = JSON.parse(menuEditor.getString()); };

    let menuEditor;
    function buildEditor(theme) {
      applyThemeCss(theme);
      themeBadge.textContent = theme;
      paintButtons(theme);

      const host = $("element-id");
      host.replaceChildren();   // drop items from a prior mount
      host.className = "";       // drop structural + old-theme classes

      menuEditor = new MenuEditor("element-id", { maxLevel: 3, theme });
      menuEditor.onClickDelete((e) => {
        if (confirm("Delete the item " + e.item.getDataset().text + "?")) { e.item.remove(); syncState(); }
      });
      menuEditor.onClickEdit((e) => {
        const a = e.item.getDataset();
        fields.text.value = a.text; fields.href.value = a.href; fields.icon.value = a.icon; fields.tooltip.value = a.tooltip;
        btnUpdate.disabled = false;
        menuEditor.edit(e.item);
      });
      menuEditor.onDragEnd(syncState);
      menuEditor.setArray(nestedData);
      menuEditor.mount();
    }

    btnAdd.addEventListener("click", () => { menuEditor.add(readForm()); syncState(); btnUpdate.disabled = true; cleanForm(); });
    btnUpdate.addEventListener("click", () => { menuEditor.update(readForm()); syncState(); btnUpdate.disabled = true; cleanForm(); });
    btnOutput.addEventListener("click", () => { out.value = menuEditor.getString(); });
    // Persist current tree, then rebuild under the chosen theme.
    themeBtns.forEach((b) => b.addEventListener("click", () => { syncState(); buildEditor(b.dataset.theme); }));

    /*
     * Keyboard reordering / nesting on the drag handle (the library ships
     * pointer drag only). Focus a handle, then:
     *   ↑ / ↓        move the item among its siblings
     *   → or Enter   nest it into the item directly above (as last child)
     *   ←            outdent it after its current parent
     * Works on the structural DOM (`jme-item` / `jme-list`), so it's
     * theme-independent, and we snapshot state after each change.
     */
    $("element-id").addEventListener("keydown", (ev) => {
      const handle = ev.target.closest(".jme-handle");
      if (!handle) return;
      const item = handle.closest(".jme-item");
      if (!item) return;

      const refocus = () => { syncState(); item.querySelector(".jme-handle")?.focus(); };
      const key = ev.key;

      if (key === "ArrowUp" && item.previousElementSibling) {
        ev.preventDefault();
        item.parentElement.insertBefore(item, item.previousElementSibling);
        refocus();
      } else if (key === "ArrowDown" && item.nextElementSibling) {
        ev.preventDefault();
        item.parentElement.insertBefore(item.nextElementSibling, item);
        refocus();
      } else if ((key === "ArrowRight" || key === "Enter") && item.previousElementSibling) {
        ev.preventDefault();
        // nest into the sibling above: its `.jme-list` is the last child
        const targetList = item.previousElementSibling.querySelector(":scope > .jme-list");
        if (targetList) { targetList.appendChild(item); refocus(); }
      } else if (key === "ArrowLeft") {
        const parentItem = item.parentElement.closest(".jme-item");
        if (parentItem) {
          ev.preventDefault();
          parentItem.parentElement.insertBefore(item, parentItem.nextElementSibling);
          refocus();
        }
      }
    });

    buildEditor("bootstrap");
  </script>
</body>
</html>
