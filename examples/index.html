<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Menu Editor — live demo</title>

  <!-- Font Awesome for item icons -->
  <link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.2/css/all.min.css" rel="stylesheet">

  <!-- Menu Editor structural styles (framework-agnostic) from the built dist bundle -->
  <link rel="stylesheet" href="../dist/styles.min.css">

  <!--
    The active CSS framework (Bootstrap / Tailwind) is loaded on demand into
    #theme-css when the theme <select> changes — the library itself bundles none.
  -->
  <link id="theme-css" rel="stylesheet" href="">

  <style>
    :root { --bg:#0f172a; --panel:#fff; --muted:#64748b; --line:#e2e8f0; --brand:#6366f1; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; color: #0f172a;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(1200px 600px at 10% -10%, #312e81 0%, transparent 55%),
                  radial-gradient(1000px 500px at 110% 0%, #0e7490 0%, transparent 45%),
                  var(--bg);
    }
    .wrap { max-width: 1120px; margin: 0 auto; padding: 32px 20px 64px; }
    header.hero { color: #e2e8f0; margin-bottom: 28px; display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-end; justify-content: space-between; }
    header.hero h1 { margin: 0 0 4px; font-size: 1.7rem; }
    header.hero p { margin: 0; color: #94a3b8; }
    .theme-switch { display: flex; align-items: center; gap: 10px; background: rgba(255,255,255,.08); padding: 8px 12px; border-radius: 12px; backdrop-filter: blur(6px); }
    .theme-switch label { color: #cbd5e1; font-size: .85rem; }
    .theme-switch select { border: 0; border-radius: 8px; padding: 7px 12px; font-weight: 600; cursor: pointer; }

    .grid { display: grid; gap: 20px; grid-template-columns: repeat(12, 1fr); }
    .panel { background: var(--panel); border-radius: 16px; box-shadow: 0 12px 40px -12px rgba(2,6,23,.45); overflow: hidden; }
    .panel > .head { padding: 14px 18px; border-bottom: 1px solid var(--line); font-weight: 700; display: flex; align-items: center; gap: 8px; }
    .panel > .body { padding: 18px; }
    .col-tree { grid-column: span 5; }
    .col-form { grid-column: span 4; }
    .col-out  { grid-column: span 3; display: flex; flex-direction: column; }
    @media (max-width: 900px) { .col-tree,.col-form,.col-out { grid-column: span 12; } }

    .field { margin-bottom: 14px; }
    .field label { display: block; font-size: .8rem; font-weight: 600; color: var(--muted); margin-bottom: 6px; }
    .field input { width: 100%; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; font-size: .95rem; }
    .field input:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px rgba(99,102,241,.15); }

    .actions { padding: 14px 18px; border-top: 1px solid var(--line); display: flex; gap: 10px; }
    .btn { border: 0; border-radius: 10px; padding: 10px 16px; font-weight: 600; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; }
    .btn-primary { background: var(--brand); color: #fff; }
    .btn-ghost { background: #f1f5f9; color: #334155; }
    .btn-success { background: #10b981; color: #fff; }
    .btn:disabled { opacity: .5; cursor: not-allowed; }
    .ml-auto { margin-left: auto; }

    textarea#out { width: 100%; flex: 1; min-height: 260px; border: 1px solid var(--line); border-radius: 12px; padding: 12px; font: .8rem/1.5 ui-monospace, monospace; resize: vertical; }
    .badge { font-size: .7rem; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: #eef2ff; color: var(--brand); }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="hero">
      <div>
        <h1><i class="fa-solid fa-bars-staggered"></i> JavaScript Menu Editor</h1>
        <p>Drag &amp; drop nested menu — switch the presentation theme live.</p>
      </div>
      <div class="theme-switch">
        <label for="themeSelect">Theme</label>
        <select id="themeSelect">
          <option value="bootstrap">Bootstrap 5</option>
          <option value="tailwind">Tailwind</option>
        </select>
      </div>
    </header>

    <div class="grid">
      <section class="panel col-tree">
        <div class="head"><i class="fa-solid fa-sitemap" style="color:var(--brand)"></i> Menu structure <span id="themeBadge" class="badge ml-auto">bootstrap</span></div>
        <div class="body"><div id="element-id"></div></div>
      </section>

      <section class="panel col-form">
        <div class="head"><i class="fa-solid fa-pen-to-square" style="color:var(--brand)"></i> Item details</div>
        <div class="body">
          <div class="field"><label for="txtText">Text</label><input id="txtText" placeholder="Menu label" /></div>
          <div class="field"><label for="txtIcon">Icon (Font Awesome class)</label><input id="txtIcon" placeholder="fa-solid fa-house" /></div>
          <div class="field"><label for="txtHref">URL / Path</label><input id="txtHref" placeholder="/path" /></div>
          <div class="field" style="margin-bottom:0"><label for="txtTooltip">Tooltip</label><input id="txtTooltip" placeholder="Tooltip text" /></div>
        </div>
        <div class="actions">
          <button id="btnUpdate" class="btn btn-ghost" disabled><i class="fa-solid fa-rotate"></i> Update</button>
          <button id="btnAdd" class="btn btn-primary ml-auto"><i class="fa-solid fa-plus"></i> Add item</button>
        </div>
      </section>

      <section class="panel col-out">
        <div class="head"><i class="fa-solid fa-code" style="color:#10b981"></i> JSON output
          <button id="btnOutput" class="btn btn-success ml-auto" style="padding:6px 12px"><i class="fa-solid fa-arrow-rotate-right"></i> Generate</button>
        </div>
        <div class="body" style="flex:1; display:flex">
          <textarea id="out" readonly placeholder="Click Generate to export the menu…"></textarea>
        </div>
      </section>
    </div>
  </div>

  <!-- Menu Editor: built dist bundle (SortableJS included). Global: MenuEditor -->
  <script src="../dist/menu-editor.min.js"></script>
  <script>
    const THEME_CSS = {
      bootstrap: "https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css",
      // Tailwind Play CDN is a <script>; we lazy-inject it once when first selected.
      tailwind: null,
    };

    const nestedData = [
      { text: "Home", href: "/home", tooltip: "Go to home page", icon: "fa-solid fa-house", children: [] },
      { text: "About Us", href: "/about", tooltip: "About the company", icon: "fa-solid fa-address-card", children: [] },
      { text: "Services", href: "/services", tooltip: "What we offer", icon: "fa-solid fa-gear", children: [
        { text: "Service 1", href: "/services/1", tooltip: "Details 1", icon: "fa-solid fa-wrench", children: [] },
        { text: "Service 2", href: "/services/2", tooltip: "Details 2", icon: "fa-solid fa-wrench", children: [] },
      ]},
      { text: "Contact", href: "/contact", tooltip: "Get in touch", icon: "fa-solid fa-envelope", children: [] },
    ];

    const $ = (id) => document.getElementById(id);
    const fields = { text: $("txtText"), href: $("txtHref"), icon: $("txtIcon"), tooltip: $("txtTooltip") };
    const btnUpdate = $("btnUpdate"), btnAdd = $("btnAdd"), btnOutput = $("btnOutput");
    const out = $("out"), themeBadge = $("themeBadge"), themeSelect = $("themeSelect");
    const readForm = () => ({ text: fields.text.value, href: fields.href.value, icon: fields.icon.value, tooltip: fields.tooltip.value });
    const cleanForm = () => Object.values(fields).forEach((f) => (f.value = ""));

    let tailwindLoaded = false;
    function applyThemeCss(theme) {
      const link = $("theme-css");
      if (theme === "tailwind") {
        link.href = ""; // Bootstrap off
        if (!tailwindLoaded) {
          const s = document.createElement("script");
          s.src = "https://cdn.tailwindcss.com";
          document.head.appendChild(s);
          tailwindLoaded = true;
        }
      } else {
        link.href = THEME_CSS[theme] || "";
      }
    }

    let menuEditor;
    function buildEditor(theme) {
      applyThemeCss(theme);
      themeBadge.textContent = theme;

      const host = $("element-id");
      host.replaceChildren();          // drop items from a prior mount
      host.className = "";             // drop structural + old-theme classes

      menuEditor = new MenuEditor("element-id", { maxLevel: 3, theme });
      menuEditor.onClickDelete((e) => {
        if (confirm("Delete the item " + e.item.getDataset().text + "?")) e.item.remove();
      });
      menuEditor.onClickEdit((e) => {
        const a = e.item.getDataset();
        fields.text.value = a.text; fields.href.value = a.href; fields.icon.value = a.icon; fields.tooltip.value = a.tooltip;
        btnUpdate.disabled = false;
        menuEditor.edit(e.item);
      });
      menuEditor.setArray(nestedData);
      menuEditor.mount();
    }

    btnAdd.addEventListener("click", () => { menuEditor.add(readForm()); btnUpdate.disabled = true; cleanForm(); });
    btnUpdate.addEventListener("click", () => { menuEditor.update(readForm()); btnUpdate.disabled = true; cleanForm(); });
    btnOutput.addEventListener("click", () => { out.value = menuEditor.getString(); });
    themeSelect.addEventListener("change", (e) => buildEditor(e.target.value));

    buildEditor(themeSelect.value);
  </script>
</body>
</html>
