<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Menu Editor — Tailwind example</title>

  <!-- Framework CSS is loaded by the consumer (optional), NOT bundled by the library -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.2/css/all.min.css" rel="stylesheet">

  <!-- Menu Editor: structural styles from the built dist bundle -->
  <link rel="stylesheet" href="../../dist/styles.min.css">
</head>
<body class="bg-slate-100 text-slate-800">
  <header class="bg-gradient-to-r from-indigo-600 to-cyan-500 text-white shadow">
    <div class="max-w-6xl mx-auto px-4 py-6">
      <h1 class="text-2xl font-bold"><i class="fa-solid fa-bars-staggered mr-2"></i>JavaScript Menu Editor</h1>
      <p class="opacity-80">Drag &amp; drop nested menu — Tailwind theme</p>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-4 py-8 grid gap-6 lg:grid-cols-12">
    <section class="lg:col-span-5 bg-white rounded-xl shadow-sm">
      <div class="px-4 py-3 border-b font-semibold"><i class="fa-solid fa-sitemap text-indigo-600 mr-1"></i> Menu structure</div>
      <div class="p-4"><div id="element-id"></div></div>
    </section>

    <section class="lg:col-span-4 bg-white rounded-xl shadow-sm flex flex-col">
      <div class="px-4 py-3 border-b bg-indigo-600 text-white rounded-t-xl font-semibold"><i class="fa-solid fa-pen-to-square mr-1"></i> Item details</div>
      <div class="p-4 space-y-3">
        <div>
          <label for="txtText" class="block text-sm font-medium mb-1">Text</label>
          <input id="txtText" type="text" placeholder="Menu label" class="w-full rounded-lg border border-slate-300 px-3 py-2 focus:ring-2 focus:ring-indigo-500 focus:outline-none" />
        </div>
        <div>
          <label for="txtIcon" class="block text-sm font-medium mb-1">Icon <span class="text-slate-400 text-xs">(Font Awesome class)</span></label>
          <input id="txtIcon" type="text" placeholder="fa-solid fa-house" class="w-full rounded-lg border border-slate-300 px-3 py-2 focus:ring-2 focus:ring-indigo-500 focus:outline-none" />
        </div>
        <div>
          <label for="txtHref" class="block text-sm font-medium mb-1">URL / Path</label>
          <input id="txtHref" type="text" placeholder="/path" class="w-full rounded-lg border border-slate-300 px-3 py-2 focus:ring-2 focus:ring-indigo-500 focus:outline-none" />
        </div>
        <div>
          <label for="txtTooltip" class="block text-sm font-medium mb-1">Tooltip</label>
          <input id="txtTooltip" type="text" placeholder="Tooltip text" class="w-full rounded-lg border border-slate-300 px-3 py-2 focus:ring-2 focus:ring-indigo-500 focus:outline-none" />
        </div>
      </div>
      <div class="px-4 py-3 border-t mt-auto flex gap-2">
        <button id="btnUpdate" disabled class="rounded-lg border border-slate-300 px-4 py-2 text-slate-600 disabled:opacity-50"><i class="fa-solid fa-rotate"></i> Update</button>
        <button id="btnAdd" class="ml-auto rounded-lg bg-indigo-600 text-white px-4 py-2 hover:bg-indigo-700"><i class="fa-solid fa-plus"></i> Add item</button>
      </div>
    </section>

    <section class="lg:col-span-3 bg-white rounded-xl shadow-sm flex flex-col">
      <div class="px-4 py-3 border-b font-semibold flex items-center">
        <i class="fa-solid fa-code text-emerald-600 mr-1"></i> JSON output
        <button id="btnOutput" class="ml-auto rounded-lg bg-emerald-600 text-white text-sm px-3 py-1 hover:bg-emerald-700"><i class="fa-solid fa-arrow-rotate-right"></i> Generate</button>
      </div>
      <div class="p-2 flex-1">
        <textarea id="txtOutput" readonly rows="14" placeholder="Click Generate to export the menu…" class="w-full h-full rounded-lg border border-slate-300 p-2 font-mono text-xs focus:outline-none"></textarea>
      </div>
    </section>
  </main>

  <!-- Menu Editor: built dist bundle (SortableJS included). Global: MenuEditor -->
  <script src="../../dist/menu-editor.min.js"></script>
  <script src="./main.js"></script>
</body>
</html>
